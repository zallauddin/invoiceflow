# InvoiceFlow CI/CD Pipeline
# Triggered on push/PR to main. Builds, tests, lints, and reports coverage.

name: InvoiceFlow CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "knowledge.md"
      - "production.env.example"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch: # manual trigger

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20.x"
  PYTHON_VERSION: "3.12"

jobs:
  # ── .NET Backend: Build & Test ─────────────────────────────────
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore InvoiceFlow.slnx

      - name: Build
        run: dotnet build InvoiceFlow.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/InvoiceFlow.UnitTests/InvoiceFlow.UnitTests.csproj \
              --no-restore --configuration Release \
              --verbosity normal \
              --logger "console;verbosity=detailed" \
              --collect "XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: tests/**/TestResults/**/coverage.cobertura.xml
          retention-days: 7

  # ── Frontend: Build & Lint ───────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run type-check
        working-directory: frontend
        continue-on-error: true # tolerate failures until OpenAPI types are synced

      - name: Lint
        run: npm run lint
        working-directory: frontend
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: frontend
        continue-on-error: true

  # ── Python Backend: Lint & Type-check ────────────────────────
  python:
    name: Python Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy ruff

      - name: Lint (ruff)
        run: ruff check backend/
        continue-on-error: true

      - name: Type-check (mypy)
        run: mypy backend/
        continue-on-error: true

  # ── Security Scan ────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: .NET vulnerability audit
        run: dotnet list InvoiceFlow.slnx package --vulnerable --include-transitive 2>&1 | head -30

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        run: npm audit --audit-level=high || true
        working-directory: frontend
